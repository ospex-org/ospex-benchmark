name: Campaign projector contract

# Separate from the stdlib-only scorer gate. Dependency SETUP uses the package
# index; the explicit contract tests below do not access network or secrets.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  projector-contract:
    name: projector-contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Install schema-test dependency (network-enabled setup)
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r docs/campaign-projector/requirements-test.txt
      - name: Explicit offline schema and fixture tests
        shell: python
        run: |
          import os
          import subprocess
          import sys

          # Keep only OS interpreter necessities, no inherited credentials,
          # cloud/DB endpoints or Python UTF-8-mode workaround. File reads must
          # explicitly request UTF-8 even on Windows' legacy default codepage.
          allowed = {'PATH', 'SYSTEMROOT', 'WINDIR', 'COMSPEC', 'TEMP', 'TMP'}
          env = {k: v for k, v in os.environ.items() if k.upper() in allowed}
          env['PYTHONUTF8'] = '0'
          for file in ('test_fixture_integrity.py', 'test_contract.py'):
              subprocess.run(
                  [sys.executable, '-B', 'docs/campaign-projector/' + file, '-v'],
                  env=env, check=True, timeout=120,
              )
